<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片标注 - 朱笔 Zhubi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="logo">
                <a href="index.html">
                    <h1>朱笔 Zhubi</h1>
                </a>
            </div>
            <nav class="nav">
                <a href="index.html">项目管理</a>
                <a href="annotate.html" class="active">图片标注</a>
                <a href="export.html">数据导出</a>
                <a href="train.html">模型训练</a>
            </nav>
        </header>

        <!-- 面包屑导航 -->
        <nav class="breadcrumb">
            <div class="breadcrumb-item">
                <a href="index.html">🏠 首页</a>
            </div>
            <span class="breadcrumb-separator">/</span>
            <div class="breadcrumb-item active">
                <span id="breadcrumbProject">图片标注</span>
            </div>
        </nav>

        <main class="main-content annotate-page">
            <!-- 左侧：图片列表 -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3 id="projectTitle">项目名称</h3>
                    <div class="progress-info">
                        <span id="progressText">0 / 0</span>
                    </div>
                </div>
                
                <div class="upload-section">
                    <input type="file" id="fileInput" multiple accept="image/*" 
                           style="display:none;" onchange="handleUpload(event)">
                    <button class="btn btn-primary btn-block" onclick="document.getElementById('fileInput').click()">
                        ⬆️ 上传图片
                    </button>
                </div>

                <div class="image-list" id="imageList">
                    <!-- 图片缩略图列表 -->
                </div>
            </div>

            <!-- 中间：标注画布 -->
            <div class="canvas-area">
                <div class="canvas-header">
                    <div class="image-info">
                        <span id="currentImageName">未选择图片</span>
                        <span id="currentImageSize"></span>
                    </div>
                    <div class="toolbar">
                        <button class="btn btn-sm" onclick="previousImage()" title="上一张 (P)">
                            ⬅️ 上一张
                        </button>
                        <button class="btn btn-sm" onclick="nextImage()" title="下一张 (N)">
                            下一张 ➡️
                        </button>
                        <button class="btn btn-sm btn-success" onclick="saveAnnotation()" title="保存 (S)">
                            💾 保存
                        </button>
                    </div>
                </div>

                <div class="canvas-container" id="canvasContainer">
                    <canvas id="annotationCanvas"></canvas>
                </div>

                <div class="canvas-footer">
                    <div class="shortcuts-hint">
                        <span><kbd>N</kbd> 下一张</span>
                        <span><kbd>P</kbd> 上一张</span>
                        <span><kbd>S</kbd> 保存</span>
                        <span><kbd>D</kbd> 删除框</span>
                        <span><kbd>ESC</kbd> 取消绘制</span>
                    </div>
                </div>
            </div>

            <!-- 右侧：标注控制 -->
            <div class="control-panel">
                <div class="panel-section">
                    <h3>📦 当前标注</h3>
                    <div class="bbox-list" id="bboxList">
                        <div class="empty-state">暂无标注</div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>🏷️ 类别选择</h3>
                    <div class="category-list" id="categoryList">
                        <!-- 类别按钮动态生成 -->
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📊 标注统计</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <label>总图片:</label>
                            <span id="totalImages">0</span>
                        </div>
                        <div class="stat-item">
                            <label>已标注:</label>
                            <span id="annotatedImages">0</span>
                        </div>
                        <div class="stat-item">
                            <label>未标注:</label>
                            <span id="unannotatedImages">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/annotator.js"></script>
</body>
</html>
